<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../lib/slide.css">
<style>body.slide { --accent: var(--blue); }</style>
</head>
<body class="slide">
<main>
  <p class="eyebrow">Calendar</p>
  <h1>Everything in<br><mark>one calendar</mark></h1>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <img class="capture" src="../raw/06-calendar.jpeg" onerror="this.remove()">
        <div class="mock">
          <div class="statusbar"><span>9:41</span><span class="right"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div>
          <h2 style="font-size:72px; margin-top: 20px;">June 2026</h2>
          <div class="segmented"><span class="on">Month</span><span>Week</span><span>Day</span></div>
          <div class="card month">
            <div class="grid">
              <span class="dow">M</span><span class="dow">T</span><span class="dow">W</span><span class="dow">T</span><span class="dow">F</span><span class="dow">S</span><span class="dow">S</span>
              <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
              <span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span>
              <span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span class="today">21</span>
              <span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span>
              <span>29</span><span>30</span>
            </div>
          </div>
          <div class="card events">
            <div class="event"><span class="when">9:00 AM</span>Walk the dog<span class="src chore">Chore</span></div>
            <div class="event"><span class="when">11:30 AM</span>Dentist<span class="src event">Event</span></div>
            <div class="event"><span class="when">4:00 PM</span>Swimming lessons<span class="src event">Event</span></div>
            <div class="event"><span class="when">7:30 PM</span>Book club<span class="src ical">iCal</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="chip chip-a"><span class="dot"></span>Chores · Events · Meals</div>
    <div class="chip chip-b" style="top: 1620px;"><span class="dot"></span>Nothing gets missed</div>
  </div>
</main>
</body>
</html>
