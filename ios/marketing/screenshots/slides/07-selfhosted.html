<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../lib/slide.css">
<style>
body.slide {
  --accent: var(--teal);
  background: linear-gradient(180deg, #14181d 0%, #0e1114 100%);
  color: #f2f4f6;
}
body.slide main { justify-content: center; padding-top: 0; }
body.slide h1 { color: #ffffff; }
.terminal {
  margin-top: 170px;
  width: 1120px;
  border-radius: 48px;
  background: #1c2127;
  border: 2px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 60px 120px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  font-family: var(--mono);
}
.terminal .bar {
  display: flex;
  gap: 16px;
  padding: 32px 38px;
  border-bottom: 2px solid rgba(255, 255, 255, 0.06);
}
.terminal .bar i { width: 22px; height: 22px; border-radius: 50%; }
.terminal .bar i:nth-child(1) { background: #ff5f57; }
.terminal .bar i:nth-child(2) { background: #febc2e; }
.terminal .bar i:nth-child(3) { background: #28c840; }
.terminal .body { padding: 64px 68px; font-size: 50px; line-height: 1.8; }
.terminal .prompt { color: var(--teal); }
.terminal .cmd { color: #f2f4f6; }
.terminal .out { color: #8b939e; font-size: 44px; }
.terminal .ok { color: var(--green); }
.footline {
  margin-top: 130px;
  font-size: 38px;
  font-weight: 600;
  color: #8b939e;
  display: flex;
  gap: 30px;
  align-items: center;
  white-space: nowrap;
}
body.slide main { padding-bottom: 220px; }
.footline b { color: #f2f4f6; }
.footline .sep { color: var(--teal); }
</style>
</head>
<body class="slide">
<main>
  <p class="eyebrow">Self-hosted</p>
  <h1>Data that lives<br>at <mark>home</mark></h1>
  <div class="terminal">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body">
      <div><span class="prompt">$</span> <span class="cmd">docker compose up -d</span></div>
      <div class="out">family-hub pulled · migrated</div>
      <div><span class="ok">✓</span> <span class="cmd">Ready on your network</span></div>
    </div>
  </div>
  <p class="footline"><b>No third-party accounts</b><span class="sep">·</span><b>No tracking</b><span class="sep">·</span><b>Open source</b></p>
</main>
</body>
</html>
