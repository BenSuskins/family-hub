services:
  family-hub:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - DATABASE_PATH=/data/family-hub.db
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-http://localhost:8080/auth/callback}
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me-in-production-32chars}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_TOPIC=${APNS_TOPIC:-}
      - APNS_KEY_PATH=${APNS_KEY_PATH:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - LOG_LEVEL=debug
      - HUXLEY_BASE_URL=${HUXLEY_BASE_URL:-https://huxley2.azurewebsites.net}
      - HUXLEY_ACCESS_TOKEN=${HUXLEY_ACCESS_TOKEN:-}
    volumes:
      - .:/app
      - ../data:/data
      - go-cache:/root/go
    restart: unless-stopped

volumes:
  go-cache:
