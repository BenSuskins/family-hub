<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../lib/slide.css">
<style>body.slide { --accent: var(--blue); }</style>
</head>
<body class="slide">
<main>
  <p class="eyebrow">Your cookbook</p>
  <h1>Every recipe<br>in <mark>one place</mark></h1>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <img class="capture" src="../raw/04-recipes-book.jpeg" onerror="this.remove()">
        <div class="mock">
          <div class="statusbar"><span>9:41</span><span class="right"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div>
          <h2 style="font-size:72px; margin-top: 20px;">Recipes</h2>
          <div class="search">⌕　Search recipes</div>
          <div class="filters"><span class="on">All</span><span>Breakfast</span><span>Lunch</span><span>Dinner</span><span>Side</span></div>
          <div class="recipes">
            <div class="card recipe" style="--rc: var(--teal)"><div class="cover">🍗</div><div class="meta"><p class="title">Chicken stir fry</p><div class="pills"><span>20 min</span><span>Dinner</span></div></div></div>
            <div class="card recipe" style="--rc: var(--sun)"><div class="cover">🥗</div><div class="meta"><p class="title">Pasta salad</p><div class="pills"><span>12 min</span><span>Lunch</span></div></div></div>
            <div class="card recipe" style="--rc: var(--moon)"><div class="cover">🍲</div><div class="meta"><p class="title">Chilli con carne</p><div class="pills"><span>60 min</span><span>Serves 6</span></div></div></div>
            <div class="card recipe" style="--rc: var(--green)"><div class="cover">🥞</div><div class="meta"><p class="title">Weekend pancakes</p><div class="pills"><span>25 min</span><span>Breakfast</span></div></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="chip chip-a"><span class="dot"></span>Search &amp; filter by course</div>
    <div class="chip chip-b"><span class="dot"></span>One cookbook, the whole family</div>
  </div>
</main>
</body>
</html>
