name: iOS CI

on:
  push:
    branches: [main]
    paths: ['ios/**']
  pull_request:
    paths: ['ios/**']

permissions:
  contents: read

jobs:
  # FamilyHubKit is deliberately Foundation-only, so it builds and tests on Linux
  # in a fraction of the time a macOS runner takes. It catches the bulk of what
  # can go wrong in the shared layer long before the Xcode job finishes.
  package:
    name: FamilyHubKit (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Build
        run: swift build --package-path ios/FamilyHubKit

      - name: Test
        run: swift test --package-path ios/FamilyHubKit

  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.1
        run: sudo xcode-select -s /Applications/Xcode_26.1.app

      - name: Test
        run: |
          xcodebuild test \
            -project ios/FamilyHub/FamilyHub.xcodeproj \
            -scheme FamilyHub \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath ios-test-results \
            -skip-testing:FamilyHubUITests \
            CODE_SIGNING_ALLOWED=NO
