<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Hub on iPad</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 2064px;
    height: 2752px;
    margin: 0;
    overflow: hidden;
    background: #f7f1e7;
  }
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    background: #f7f1e7;
  }
  .screen, .frame {
    position: absolute;
    display: block;
    object-fit: fill;
  }
  .screen {
    left: 5.47826087%;
    top: 4.16107383%;
    width: 89.04347826%;
    height: 91.67785235%;
  }
  .frame {
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <main class="canvas">
    <img class="screen" src="__CAPTURE_URL__" alt="Family Hub iPad screen">
    <img class="frame" src="__FRAME_URL__" alt="">
  </main>
</body>
</html>
